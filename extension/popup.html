<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #86868b;
      --line: #e8e8ed;
      --hover: #f5f5f7;
      --accent: #0071e3;
    }
    * { box-sizing: border-box; }
    body {
      font: 13px -apple-system, system-ui, "Segoe UI", sans-serif;
      width: 360px; margin: 0; background: #fff; color: var(--ink);
    }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 14px 16px 10px;
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    header .count { font-size: 11px; color: var(--muted); }

    #status {
      padding: 0 16px 10px; color: var(--muted); font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    #status .err { color: #d70015; }

    #list, #aliases { padding: 6px; max-height: 240px; overflow-y: auto; }
    #list:empty::after {
      content: "このサイトのログイン情報はありません";
      display: block; padding: 22px 10px; text-align: center;
      color: var(--muted); font-size: 12px;
    }

    .cred {
      width: 100%; background: white; color: var(--ink); border: 0; font: inherit; text-align: left;
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
    }
    .cred:hover { background: var(--hover); }
    .cred .avatar {
      width: 28px; height: 28px; flex: none; border-radius: 6px;
      display: grid; place-items: center; font-weight: 600; font-size: 13px;
      text-transform: uppercase; color: var(--muted);
      background: var(--hover); border: 1px solid var(--line);
    }
    .cred:hover .avatar { background: #fff; }
    .cred .meta { min-width: 0; flex: 1; }
    .cred .u { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cred .d { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cred .code {
      flex: none; font-size: 12px; color: var(--accent); letter-spacing: .06em;
      font-variant-numeric: tabular-nums; padding: 2px 6px; border-radius: 5px;
    }
    .cred .code:hover { background: #eaf3ff; }
    .cred .fill { flex: none; font-size: 11px; color: var(--accent); }
    .cred:hover .fill { opacity: 1; }
    .settings { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .login-row { display: flex; align-items: center; }
    .login-row .cred { flex: 1; min-width: 0; }
    .copy-code { flex: none; border: 0; background: #eef3ff; color: var(--accent); border-radius: 6px; padding: 7px; cursor: pointer; font-size: 11px; }
    h2 { font-size: 12px; padding: 0 16px; color: var(--muted); }
    .hint { font-size: 11px; color: var(--muted); padding: 0 16px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>iCloud Passwords</h1>
    <span class="count" id="subcount"></span>
  </header>
  <div id="status">接続中…</div>
  <div class="settings"><label><input type="checkbox" id="automatic" checked> 自動入力を有効にする</label></div>
  <div id="list"></div>
  <h2>メールを非公開</h2>
  <div id="aliases"></div>
  <div class="hint">アドレスを選ぶと、このサイトで次回から自動入力します。</div>
  <script src="popup.js"></script>
</body>
</html>
